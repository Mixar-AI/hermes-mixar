# Draft of plugin-catalog/mixar.yaml for a PR to NousResearch/hermes-agent.
# Submit it as that one file, after pushing this repo: set sha to the full
# 40-character commit the PR pins and keep version in step with plugin.json.
# requires_hermes: v0.22.1 is the first release that honours a portable
# server's timeout declaration (NousResearch/hermes-agent fcc170b798).
name: mixar
repo: https://github.com/Mixar-AI/hermes-mixar
sha: 0000000000000000000000000000000000000000
version: "0.1.0"
title: Mixar
maintainer: Mixar-AI
tier: community
category: tools
requires_hermes: ">=0.22.1"
docs_url: https://github.com/Mixar-AI/hermes-mixar#readme
platforms: [macos, windows, linux]
description: "Mixar's desktop MCP server over stdio with a Mixar workflow skill: build and edit 3D scenes, generate models, textures, rigs and animation with AI, render, and export game-ready assets for Unity, Unreal and Godot. Requires Mixar 4.2.1+ on macOS, Windows or Linux, signed in with Connect MCP turned on, on the same computer as Hermes. Disclosure — runs the launcher the installed Mixar app writes at ~/.mixar/connector/mixar-mcp (%USERPROFILE%\\.mixar\\connector\\mixar-mcp.cmd on Windows); tools execute arbitrary Python inside Mixar with your privileges; a tool call can start the installed Mixar app; calls go over loopback to Mixar, which forwards them to api.mixar.app under the signed-in account; AI generation and create_layered_material spend Mixar credits; the plugin stores no credentials and ships no binaries; at install Hermes looks for Mixar (macOS: Mixar.app in /Applications and ~/Applications; Windows: the installed-apps entry or %ProgramFiles%\\Mixar; Linux: a mixar command on PATH or Mixar's launcher) and refuses the install when it is missing or, on macOS and Windows, older than 4.2.1."
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env: []
